<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>批阅主观题</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="container"><div class="header"><h1><i class="fas fa-edit"></i> 批阅：<span th:text="${exam.name}"></span></h1><a class="btn" href="/teacher/grading"><i class="fas fa-arrow-left"></i> 返回</a></div><div class="card"><i class="fas fa-user"></i> 学生：<span th:text="${student?.realName}"></span> / <span th:text="${student?.className}"></span>　<i class="fas fa-check-circle"></i> 客观题得分：<span th:text="${result.objectiveScore}"></span></div><form method="post" th:action="@{/teacher/grading/{id}(id=${result.id})}"><div th:each="q,stat:${essays}" class="question-card"><h3><span th:text="${stat.index+1} + '. ' + ${q.title}"></span><span class="badge" th:text="${scoreMap.get(q.id)} + '分'"></span></h3><p><b><i class="fas fa-pencil-alt"></i> 学生答案：</b></p><div class="card" th:text="${answers.get('' + q.id)}"></div><p><b><i class="fas fa-check"></i> 参考答案：</b><span th:text="${q.answer}"></span></p><p><b><i class="fas fa-lightbulb"></i> 解析：</b><span th:text="${q.analysis}"></span></p><div class="form-group"><label><i class="fas fa-star"></i> 给分</label><input type="number" min="0" th:max="${scoreMap.get(q.id)}" th:name="'score_' + ${q.id}" value="0"></div></div><button class="btn-primary"><i class="fas fa-save"></i> 保存批阅结果</button></form></div></body></html>
