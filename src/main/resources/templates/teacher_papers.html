<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>试卷管理</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="container"><div class="header"><h1><i class="fas fa-file-alt"></i> 试卷管理</h1><div class="nav-links"><a class="btn" href="/teacher/dashboard"><i class="fas fa-arrow-left"></i> 返回</a><a class="btn-primary" href="/teacher/papers/add"><i class="fas fa-plus"></i> 创建新试卷</a></div></div><div th:if="${error}" class="alert" th:text="${error}"></div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><table><thead><tr><th>ID</th><th>名称</th><th>科目</th><th>描述</th><th>题数</th><th>操作</th></tr></thead><tbody><tr th:each="p:${papers}"><td th:text="${p.id}"></td><td th:text="${p.name}"></td><td th:text="${p.subject}"></td><td th:text="${p.description}"></td><td th:text="${paperQuestionCountMap.get(p.id)}"></td><td><form method="post" th:action="@{/teacher/papers/delete/{id}(id=${p.id})}" onsubmit="return confirm('确认删除？')"><button class="btn-outline danger-btn"><i class="fas fa-trash"></i> 删除</button></form></td></tr></tbody></table></div></body></html>
