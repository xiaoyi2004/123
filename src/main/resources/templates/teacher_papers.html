<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试卷管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-newspaper"></i> 试卷管理</h1>
        <div class="nav-links">
            <a class="btn" href="/teacher/dashboard"><i class="fas fa-home"></i> 返回</a>
            <a class="btn-primary" href="/teacher/papers/add"><i class="fas fa-plus"></i> 创建新试卷</a>
        </div>
    </div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="table-wrapper">
        <table>
            <thead><tr><th>ID</th><th>名称</th><th>科目</th><th>描述</th><th>题数</th><th>操作</th></tr></thead>
            <tbody>
            <tr th:each="p : ${papers}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.subject}"></td>
                <td th:text="${p.description}"></td>
                <td th:text="${paperQuestionCountMap.get(p.id)}"></td>
                <td>
                    <form method="post" th:action="@{/teacher/papers/delete/{id}(id=${p.id})}" onsubmit="return confirm('确认删除试卷及其所有题目关联？')">
                        <button class="btn-outline danger-btn"><i class="fas fa-trash"></i> 删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${papers.empty}"><td colspan="6" style="text-align:center;">暂无试卷，点击创建新试卷</td></tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
