<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试中 · 请勿切屏</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1 th:text="${exam.name}"></h1>
        <div><i class="fas fa-user"></i> <span th:text="${student.realName}"></span> · <span th:text="${student.className}"></span></div>
    </div>
    <div id="timer">
        <span><i class="fas fa-hourglass-half"></i> 剩余时间：<span id="clock">--:--</span></span>
        <span><i class="fas fa-eye-slash"></i> 切屏次数：<span id="leaveCount">0</span></span>
    </div>
    <form id="examForm" method="post" th:action="@{/exam/{id}/submit(id=${exam.id})}">
        <div th:each="q,stat : ${questions}" class="question-card" style="margin-bottom: 1.5rem;">
            <h3><span th:text="${stat.index+1} + '. ' + ${q.title}"></span> <span class="badge" th:text="${scoreMap.get(q.id)} + '分'"></span></h3>
            <img th:if="${q.imageUrl}" th:src="@{${q.imageUrl}}" style="max-width: 100%; max-height: 180px; border-radius: 1rem; margin: 0.5rem 0;">
            <div th:if="${q.type=='single'}">
                <label class="radio-option" th:if="${q.optionA}"><input type="radio" th:name="'q_'+${q.id}" value="A"> A. <span th:text="${q.optionA}"></span></label>
                <label class="radio-option" th:if="${q.optionB}"><input type="radio" th:name="'q_'+${q.id}" value="B"> B. <span th:text="${q.optionB}"></span></label>
                <label class="radio-option" th:if="${q.optionC}"><input type="radio" th:name="'q_'+${q.id}" value="C"> C. <span th:text="${q.optionC}"></span></label>
                <label class="radio-option" th:if="${q.optionD}"><input type="radio" th:name="'q_'+${q.id}" value="D"> D. <span th:text="${q.optionD}"></span></label>
            </div>
            <div th:if="${q.type=='judge'}">
                <label class="radio-option"><input type="radio" th:name="'q_'+${q.id}" value="A"> 正确</label>
                <label class="radio-option"><input type="radio" th:name="'q_'+${q.id}" value="B"> 错误</label>
            </div>
            <div th:if="${q.type=='fill'}">
                <input type="text" th:name="'q_'+${q.id}" placeholder="请输入答案" class="form-group">
            </div>
            <div th:if="${q.type=='essay'}">
                <textarea th:name="'q_'+${q.id}" rows="4" placeholder="请在此输入你的回答..." style="width:100%; border-radius:1rem;"></textarea>
            </div>
        </div>
        <button type="submit" class="btn-primary" onclick="return confirm('确认提交试卷？提交后不可修改。')"><i class="fas fa-paper-plane"></i> 提交试卷</button>
    </form>
</div>
<script>
    let seconds = [[${exam.duration}]] * 60;
    const timerSpan = document.getElementById('clock');
    const form = document.getElementById('examForm');
    const interval = setInterval(() => {
        if (seconds <= 0) {
            clearInterval(interval);
            alert('考试时间已到，系统将自动交卷');
            form.submit();
        } else {
            seconds--;
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            timerSpan.innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }
    }, 1000);

    let leaveCount = 0;
    const leaveSpan = document.getElementById('leaveCount');
    function recordTabSwitch() {
        leaveCount++;
        leaveSpan.innerText = leaveCount;
        alert(`警告：检测到切屏行为，已记录 ${leaveCount} 次。请诚信考试！`);
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) recordTabSwitch(); });
    window.addEventListener('blur', () => recordTabSwitch());
</script>
</body>
</html>
