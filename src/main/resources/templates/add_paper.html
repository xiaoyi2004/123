<!DOCTYPE html><html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>创建试卷</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"></head><body><div class="container"><div class="header"><h1><i class="fas fa-file-alt"></i> 创建试卷</h1><div class="nav-links"><a class="btn" href="/teacher/papers"><i class="fas fa-arrow-left"></i> 返回试卷列表</a></div></div><form method="get" action="/teacher/papers/add" class="grid"><select name="type"><option value="">全部题型</option><option value="single" th:selected="${selectedType=='single'}">单选题</option><option value="judge" th:selected="${selectedType=='judge'}">判断题</option><option value="fill" th:selected="${selectedType=='fill'}">填空题</option><option value="essay" th:selected="${selectedType=='essay'}">主观题</option></select><input name="subject" placeholder="科目" th:value="${selectedSubject}"><button class="btn-primary"><i class="fas fa-filter"></i> 筛选题目</button></form><form method="post" action="/teacher/papers/add"><div class="form-group"><label><i class="fas fa-tag"></i> 试卷名称</label><input name="name" required></div><div class="form-group"><label><i class="fas fa-book"></i> 科目</label><input name="subject" th:value="${selectedSubject}" required></div><div class="form-group"><label><i class="fas fa-info-circle"></i> 说明</label><input name="description"></div><h3><i class="fas fa-list"></i> 选择题目并赋分</h3><table><thead><tr><th>选择</th><th>题型</th><th>科目</th><th>题干</th><th>分值</th></tr></thead><tbody><tr th:each="q:${questions}"><td><input type="checkbox" name="questionIds" th:value="${q.id}"></td><td th:text="${q.type}"></td><td th:text="${q.subject}"></td><td th:text="${q.title}"></td><td><input type="number" min="0" th:name="'score_' + ${q.id}" value="5" style="width:90px"></td></tr></tbody></table><div class="pager"><a class="btn" th:if="${questionPage.hasPrevious()}" th:href="@{/teacher/papers/add(type=${selectedType},subject=${selectedSubject},page=${questionPage.number-1})}"><i class="fas fa-chevron-left"></i> 上一页</a><span th:text="${questionPage.number+1} + ' / ' + ${questionPage.totalPages==0?1:questionPage.totalPages}"></span><a class="btn" th:if="${questionPage.hasNext()}" th:href="@{/teacher/papers/add(type=${selectedType},subject=${selectedSubject},page=${questionPage.number+1})}">下一页 <i class="fas fa-chevron-right"></i></a></div><button class="btn-primary"><i class="fas fa-save"></i> 创建试卷</button></form></div></body></html>
