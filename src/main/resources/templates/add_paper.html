<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建试卷</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-layer-group"></i> 创建试卷</h1>
        <a class="btn" href="/teacher/papers"><i class="fas fa-arrow-left"></i> 返回试卷列表</a>
    </div>

    <form method="get" action="/teacher/papers/add" class="grid">
        <select name="type">
            <option value="">全部题型</option>
            <option value="single" th:selected="${selectedType=='single'}">单选题</option>
            <option value="judge" th:selected="${selectedType=='judge'}">判断题</option>
            <option value="fill" th:selected="${selectedType=='fill'}">填空题</option>
            <option value="essay" th:selected="${selectedType=='essay'}">主观题</option>
        </select>
        <input name="subject" placeholder="科目" th:value="${selectedSubject}">
        <button class="btn-primary" type="submit"><i class="fas fa-filter"></i> 筛选题目</button>
    </form>

    <form method="post" action="/teacher/papers/add">
        <div class="form-group"><label>试卷名称</label><input name="name" required></div>
        <div class="form-group"><label>科目</label><input name="subject" th:value="${selectedSubject}" required></div>
        <div class="form-group"><label>说明</label><input name="description"></div>
        <h3><i class="fas fa-list-ul"></i> 选择题目并赋分</h3>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>选择</th><th>题型</th><th>科目</th><th>题干</th><th>分值</th></tr></thead>
                <tbody>
                <tr th:each="q : ${questions}">
                    <td><input type="checkbox" name="questionIds" th:value="${q.id}"></td>
                    <td><span class="badge" th:text="${q.type}"></span></td>
                    <td th:text="${q.subject}"></td>
                    <td th:text="${q.title.length() > 80 ? q.title.substring(0,80)+'...' : q.title}"></td>
                    <td><input type="number" min="0" th:name="'score_' + ${q.id}" value="5" style="width:90px"></td>
                </tr>
                <tr th:if="${questions.empty}"><td colspan="5" style="text-align:center;">暂无题目，请先<a href="/teacher/questions/add">新增题目</a></td></tr>
                </tbody>
            </table>
        </div>
        <div class="pager" th:if="${questionPage != null}">
            <a class="btn" th:if="${questionPage.hasPrevious()}" th:href="@{/teacher/papers/add(type=${selectedType},subject=${selectedSubject},page=${questionPage.number-1})}">上一页</a>
            <span>第 <span th:text="${questionPage.number+1}"></span> / <span th:text="${questionPage.totalPages==0?1:questionPage.totalPages}"></span> 页</span>
            <a class="btn" th:if="${questionPage.hasNext()}" th:href="@{/teacher/papers/add(type=${selectedType},subject=${selectedSubject},page=${questionPage.number+1})}">下一页</a>
        </div>
        <button class="btn-primary" type="submit"><i class="fas fa-save"></i> 创建试卷</button>
    </form>
</div>
</body>
</html>
