<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>课程表单</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1 th:text="${course.id == null ? '新增课程' : '修改课程'}"><i class="fas fa-book"></i></h1>
    <a class="btn" href="/admin/courses"><i class="fas fa-arrow-left"></i> 返回</a>
  </div>
  <form method="post" th:action="@{/admin/courses/save}">
    <input type="hidden" name="id" th:value="${course.id}">
    <div class="form-group"><label>课程名称</label><input name="name" th:value="${course.name}" required></div>
    <div class="form-group"><label>课程编码</label><input name="code" th:value="${course.code}"></div>
    <div class="form-group"><label>描述</label><input name="description" th:value="${course.description}"></div>
    <div class="form-group"><label>负责教师ID</label><input type="number" name="teacherId" th:value="${course.teacherId}"></div>
    <button class="btn-primary"><i class="fas fa-save"></i> 保存</button>
  </form>
</div>
</body>
</html>
