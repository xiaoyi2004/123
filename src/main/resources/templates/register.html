<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 - 在线考试系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <div class="header" style="border-bottom: none;">
        <h1>📝 注册新账号</h1>
    </div>

    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <form method="post" action="/register">
        <div class="form-group">
            <label>👤 用户名</label>
            <input type="text" name="username" required autofocus placeholder="字母、数字或下划线">
        </div>
        <div class="form-group">
            <label>🔒 密码</label>
            <input type="password" name="password" required placeholder="至少3位">
        </div>
        <div class="form-group">
            <label>📛 真实姓名</label>
            <input type="text" name="realName" placeholder="（可选）">
        </div>
        <div class="form-group">
            <label>🎓 注册角色</label>
            <select name="role" required>
                <option value="student">学生</option>
                <option value="teacher">教师</option>
            </select>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;">立即注册</button>
        <div style="text-align: center; margin-top: 1rem;">
            <a href="/login">已有账号？去登录 →</a>
        </div>
    </form>
</div>
</body>
</html>
