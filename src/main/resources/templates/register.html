<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册 - 在线考试系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        function toggleStudentFields() {
            let role = document.getElementById('role').value;
            document.getElementById('studentFields').style.display = role === 'student' ? 'block' : 'none';
        }
    </script>
</head>
<body>
<div class="container" style="max-width: 600px;">
    <div class="header">
        <h1><i class="fas fa-user-plus"></i> 注册账号</h1>
        <a class="btn" href="/login"><i class="fas fa-arrow-left"></i> 返回登录</a>
    </div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form method="post" action="/register">
        <div class="form-group">
            <label><i class="fas fa-user"></i> 用户名</label>
            <input name="username" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> 密码 (至少3位)</label>
            <input name="password" type="password" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-id-card"></i> 姓名</label>
            <input name="realName">
        </div>
        <div class="form-group">
            <label><i class="fas fa-user-tag"></i> 角色</label>
            <select name="role" id="role" onchange="toggleStudentFields()">
                <option value="student">学生</option>
                <option value="teacher">教师</option>
            </select>
        </div>
        <div id="studentFields">
            <div class="form-group">
                <label><i class="fas fa-school"></i> 班级</label>
                <input name="className" list="classList" placeholder="如：计科2301">
                <datalist id="classList">
                    <option th:each="c:${classes}" th:value="${c}"></option>
                </datalist>
            </div>
            <div class="form-group">
                <label><i class="fas fa-hashtag"></i> 学号</label>
                <input name="studentNo">
            </div>
        </div>
        <button class="btn-primary" type="submit"><i class="fas fa-check-circle"></i> 注册</button>
    </form>
</div>
<script>toggleStudentFields();</script>
</body>
</html>
