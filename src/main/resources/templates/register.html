<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>注册</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        function toggleAdminKey() {
            let role = document.getElementById('role').value;
            document.getElementById('adminKeyDiv').style.display = (role === 'admin') ? 'block' : 'none';
        }
    </script>
</head>
<body>
<div class="container" style="max-width:520px">
    <h1>注册账号</h1>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form method="post" action="/register">
        <div class="form-group"><label>用户名</label><input name="username" required></div>
        <div class="form-group"><label>密码</label><input name="password" type="password" required></div>
        <div class="form-group"><label>姓名</label><input name="realName"></div>
        <div class="form-group"><label>角色</label>
            <select name="role" id="role" onchange="toggleAdminKey()">
                <option value="student">学生</option>
                <option value="teacher">教师</option>
                <option value="admin">管理员</option>
            </select>
        </div>
        <div id="adminKeyDiv" style="display:none">
            <div class="form-group"><label>管理员注册码</label><input name="adminKey"></div>
        </div>
        <div id="studentFields">
            <div class="form-group"><label>班级</label><input name="className" list="classList" placeholder="如：计科2301">
                <datalist id="classList"><option th:each="c:${classes}" th:value="${c}"></option></datalist>
            </div>
            <div class="form-group"><label>学号</label><input name="studentNo"></div>
        </div>
        <button class="btn-primary">注册</button>
        <a class="btn" href="/login">返回登录</a>
    </form>
</div>
</body>
</html>
