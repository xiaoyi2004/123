<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的通知</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script>
        function markRead(id) {
            fetch('/notification/read/' + id, {method: 'POST'})
                .then(() => location.reload());
        }
    </script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-bell"></i> 通知</h1>
        <a class="btn" th:href="${session.user.role == 'student' ? '/student/dashboard' : '/teacher/dashboard'}">返回</a>
    </div>
    <div th:if="${unreadCount > 0}" class="alert">您有 <span th:text="${unreadCount}"></span> 条未读通知</div>
    <div th:each="un : ${notifications}" class="card" th:style="${un.isRead == 0 ? 'border-left: 4px solid #4F46E5;' : ''}">
        <h3 th:text="${un.notification.title}"></h3>
        <p th:text="${un.notification.content}"></p>
        <p class="muted">
            类型：<span th:text="${un.notification.type}"></span>　
            时间：<span th:text="${un.notification.sentAt}"></span>
            <a th:if="${un.targetUrl}" th:href="${un.targetUrl}">查看详情</a>
            <button th:if="${un.isRead == 0}" class="btn-outline" onclick="markRead(${un.id})">标记已读</button>
            <span th:if="${un.isRead == 1}" class="badge">已读</span>
        </p>
    </div>
</div>
</body>
</html>
