<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>公告管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-bullhorn"></i> 公告管理</h1>
        <div>
            <a class="btn" href="/admin/dashboard"><i class="fas fa-arrow-left"></i> 返回</a>
            <a class="btn-primary" href="/admin/announcements/form"><i class="fas fa-plus"></i> 新增公告</a>
        </div>
    </div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <table>
        <thead>
        <tr>
            <th>标题</th>
            <th>内容</th>
            <th>状态</th>
            <th>发布时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${announcements}">
            <td th:text="${a.title}"></td>
            <td th:text="${a.content}"></td>
            <td>
                <span th:if="${a.status == 0}" style="color:gray;">草稿</span>
                <span th:if="${a.status == 1}" style="color:green;">已发布</span>
                <span th:if="${a.status == 2}" style="color:gray;">已下线</span>
            </td>
            <td th:text="${a.createdAt}"></td>
            <td>
                <a class="btn-outline" th:href="'/admin/announcements/form?id=' + ${a.id}"><i class="fas fa-edit"></i> 修改</a>
                <form style="display:inline" method="post" th:action="'/admin/announcements/publish/' + ${a.id}" onsubmit="return confirm('确认发布？')">
                    <button class="btn-primary" th:if="${a.status == 0}"><i class="fas fa-check"></i> 发布</button>
                </form>
                <form style="display:inline" method="post" th:action="'/admin/announcements/delete/' + ${a.id}" onsubmit="return confirm('确认删除？')">
                    <button class="btn-outline danger-btn"><i class="fas fa-trash"></i> 删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
