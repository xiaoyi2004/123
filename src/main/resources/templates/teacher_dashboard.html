<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师后台 - 在线考试系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>👨‍🏫 教师工作台</h1>
        <div class="nav-links">
            <a href="/teacher/questions" class="btn">📋 题库管理</a>
            <a href="/teacher/questions/add" class="btn">➕ 新增题目</a>
            <a href="/teacher/papers/add" class="btn">📄 创建试卷</a>
            <a href="/teacher/exams/add" class="btn">📅 发布考试</a>
            <a href="/teacher/results" class="btn">📊 查看成绩</a>
            <a href="/logout" class="btn danger-btn">🚪 退出登录</a>
        </div>
    </div>
    <div style="text-align: center; padding: 3rem 1rem;">
        <div class="card" style="display: inline-block; width: 250px; margin: 1rem;">
            <h3>📝 题库</h3>
            <p>管理所有试题</p>
            <a href="/teacher/questions" class="btn-primary">前往</a>
        </div>
        <div class="card" style="display: inline-block; width: 250px; margin: 1rem;">
            <h3>📑 试卷</h3>
            <p>创建/编辑试卷</p>
            <a href="/teacher/papers/add" class="btn-primary">创建</a>
        </div>
        <div class="card" style="display: inline-block; width: 250px; margin: 1rem;">
            <h3>🎯 考试</h3>
            <p>发布新的考试</p>
            <a href="/teacher/exams/add" class="btn-primary">发布</a>
        </div>
        <div class="card" style="display: inline-block; width: 250px; margin: 1rem;">
            <h3>📈 成绩</h3>
            <p>查看所有成绩</p>
            <a href="/teacher/results" class="btn-primary">查看</a>
        </div>
    </div>
</div>
</body>
</html>
