<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师工作台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chalkboard-user"></i> 教师工作台</h1>
        <div class="nav-links">
            <a href="/logout" class="btn danger-btn"><i class="fas fa-sign-out-alt"></i> 退出</a>
        </div>
    </div>
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-info">
                <h3>题库题目</h3>
                <div class="stat-number" th:text="${questionCount}">0</div>
            </div>
            <div class="stat-icon"><i class="fas fa-database"></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>试卷数量</h3>
                <div class="stat-number" th:text="${paperCount}">0</div>
            </div>
            <div class="stat-icon"><i class="fas fa-file-alt"></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>进行中考试</h3>
                <div class="stat-number" th:text="${activeExamCount}">0</div>
            </div>
            <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
        </div>
        <div class="stat-card">
            <div class="stat-info">
                <h3>待批阅试卷</h3>
                <div class="stat-number" th:text="${pendingGradingCount}">0</div>
            </div>
            <div class="stat-icon"><i class="fas fa-pen-ruler"></i></div>
        </div>
    </div>

    <div class="feature-grid">
        <div class="feature-card" onclick="location.href='/teacher/questions'">
            <div class="feature-icon"><i class="fas fa-layer-group"></i></div>
            <h3>题库管理</h3>
            <p>增删改查、批量导入</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/papers'">
            <div class="feature-icon"><i class="fas fa-newspaper"></i></div>
            <h3>试卷管理</h3>
            <p>组卷、赋分、预览</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/exams/add'">
            <div class="feature-icon"><i class="fas fa-calendar-alt"></i></div>
            <h3>发布考试</h3>
            <p>设置时间、班级</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/grading'">
            <div class="feature-icon"><i class="fas fa-check-double"></i></div>
            <h3>主观题批阅</h3>
            <p>手动评分</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/results'">
            <div class="feature-icon"><i class="fas fa-chart-simple"></i></div>
            <h3>成绩总览</h3>
            <p>按班级查看</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/questions/import'">
            <div class="feature-icon"><i class="fas fa-upload"></i></div>
            <h3>批量导入</h3>
            <p>支持Word/Txt</p>
        </div>
    </div>
</div>
</body>
</html>
