<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教师工作台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chalkboard-teacher"></i> 教师工作台</h1>
        <a href="/logout" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> 退出</a>
    </div>
    <p>欢迎，<span th:text="${session.user.realName ?: session.user.username}"></span></p>
    <div class="feature-grid">
        <div class="feature-card" onclick="location.href='/teacher/questions'">
            <div class="feature-icon"><i class="fas fa-database"></i></div>
            <h3>题库管理</h3>
            <p>增删改查、题型/科目筛选、分页</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/papers'">
            <div class="feature-icon"><i class="fas fa-file-alt"></i></div>
            <h3>试卷管理</h3>
            <p>按题型组卷，创建时赋分</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/exams/add'">
            <div class="feature-icon"><i class="fas fa-calendar-alt"></i></div>
            <h3>发布考试</h3>
            <p>按班级、科目发布</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/grading'">
            <div class="feature-icon"><i class="fas fa-pen-fancy"></i></div>
            <h3>主观题批阅</h3>
            <p>教师给分</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/results'">
            <div class="feature-icon"><i class="fas fa-chart-line"></i></div>
            <h3>成绩总览</h3>
            <p>按班级查看</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/questions/import'">
            <div class="feature-icon"><i class="fas fa-upload"></i></div>
            <h3>批量导入</h3>
        </div>
    </div>
</div>
</body>
</html>
