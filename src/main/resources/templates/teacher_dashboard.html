<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>教师工作台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chalkboard-teacher"></i> 教师工作台</h1>
        <div class="nav-links">
            <a class="btn" href="/announcement/list"><i class="fas fa-bullhorn"></i> 公告</a>
            <a class="btn danger-btn" href="/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
        </div>
    </div>
    <p>欢迎，<span th:text="${session.user.realName ?: session.user.username}"></span></p>

    <div class="feature-grid">
        <div class="feature-card" onclick="location.href='/teacher/questions'">
            <div class="feature-icon"><i class="fas fa-book-open"></i></div>
            <h3>题库管理</h3>
            <p class="muted">增删改查、筛选分页、导入</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/papers'">
            <div class="feature-icon"><i class="fas fa-file-alt"></i></div>
            <h3>试卷管理</h3>
            <p class="muted">组卷、赋分</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/exams/add'">
            <div class="feature-icon"><i class="fas fa-calendar-plus"></i></div>
            <h3>发布考试</h3>
            <p class="muted">按班级、科目，配置选项</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/grading'">
            <div class="feature-icon"><i class="fas fa-pen-fancy"></i></div>
            <h3>主观题批阅</h3>
            <p class="muted">给分和评语</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/results'">
            <div class="feature-icon"><i class="fas fa-chart-pie"></i></div>
            <h3>成绩总览</h3>
            <p class="muted">按班级查看、导出、统计</p>
        </div>
        <div class="feature-card" onclick="location.href='/teacher/questions/import'">
            <div class="feature-icon"><i class="fas fa-file-import"></i></div>
            <h3>批量导入</h3>
        </div>
    </div>
</div>
</body>
</html>
