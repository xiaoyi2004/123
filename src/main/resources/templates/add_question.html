<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增题目</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        function toggleOptions() {
            let type = document.getElementById("typeSelect").value;
            let optionDivs = document.querySelectorAll(".option-group");
            let judgeDiv = document.getElementById("judgeOptions");
            let answerHint = document.getElementById("answerHint");

            // 先全部隐藏原有选项组
            optionDivs.forEach(div => div.style.display = "none");
            judgeDiv.style.display = "none";

            if (type === "fill") {
                answerHint.innerText = "填空题答案：填写标准文本（建议精确匹配）";
            } else if (type === "judge") {
                judgeDiv.style.display = "block";
                answerHint.innerText = "判断题答案：选择正确或错误";
                // 清除原有ABCD字段的值
                document.getElementsByName('optionA')[0].value = '';
                document.getElementsByName('optionB')[0].value = '';
            } else if (type === "essay") {
                answerHint.innerText = "简答题参考答案：填写关键词（多个关键词可用逗号分隔）";
            } else { // single
                optionDivs.forEach(div => div.style.display = "block");
                answerHint.innerText = "单选题答案：填写选项字母（A/B/C/D）";
            }
        }
    </script>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>✍️ 新增题目</h1>
        <a href="/teacher/questions" class="btn">← 返回题库</a>
    </div>
    <form method="post" enctype="multipart/form-data" th:action="@{/teacher/questions/add}" th:object="${question}">
        <div class="form-group">
            <label>题干</label>
            <input type="text" name="title" required>
        </div>
        <div class="form-group">
            <label>题型</label>
            <select name="type" id="typeSelect" onchange="toggleOptions()">
                <option value="single">单选题</option>
                <option value="judge">判断题</option>
                <option value="fill">填空题</option>
                <option value="essay">简答题</option>
            </select>
        </div>

        <div class="option-group">
            <label>选项A</label><input name="optionA">
        </div>
        <div class="option-group">
            <label>选项B</label><input name="optionB">
        </div>
        <div class="option-group">
            <label>选项C</label><input name="optionC">
        </div>
        <div class="option-group">
            <label>选项D</label><input name="optionD">
        </div>

        <!-- 在原有 .option-group 区域后增加一个专门用于判断题的容器 -->
        <div id="judgeOptions" style="display: none;">
            <label style="display: inline-flex; align-items: center; gap: 1rem; margin-top: 0.5rem;">
                <input type="radio" name="judgeTemp" value="A" onchange="document.getElementsByName('answer')[0].value='A'"> 正确
            </label>
            <label style="display: inline-flex; align-items: center; gap: 1rem; margin-left: 1.5rem;">
                <input type="radio" name="judgeTemp" value="B" onchange="document.getElementsByName('answer')[0].value='B'"> 错误
            </label>
        </div>

        <div class="form-group">
            <label>题干图片（可选）</label>
            <input type="file" name="imageFile" accept="image/*">
        </div>

        <div class="form-group">
            <label>正确答案</label>
            <input name="answer" required>
            <small id="answerHint" style="color:#4b5563;">单选题填 A/B/C/D；判断题填 A/B；填空题填文字</small>
        </div>
        <div class="form-group">
            <label>分值</label>
            <input type="number" name="score" value="5" min="1">
        </div>
        <button type="submit" class="btn-primary">保存题目</button>
    </form>
</div>
<script>toggleOptions();</script>
</body>
</html>
