<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>录入题目</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>
        function toggleOptions() {
            let type = document.getElementById('typeSelect').value;
            document.getElementById('options').style.display = (type === 'single') ? 'block' : 'none';
            document.getElementById('judgeHint').style.display = (type === 'judge') ? 'block' : 'none';
        }
    </script>
</head>
<body onload="toggleOptions()">
<div class="container">
    <div class="header">
        <h1 th:text="${question.id==null?'新增题目':'修改题目'}"><i class="fas fa-edit"></i> 题目</h1>
        <a class="btn" href="/teacher/questions"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>
    <form method="post" enctype="multipart/form-data" th:action="${question.id==null}?@{/teacher/questions/add}:@{/teacher/questions/edit/{id}(id=${question.id})}">
        <div class="form-group"><label><i class="fas fa-tag"></i> 题型</label>
            <select name="type" id="typeSelect" onchange="toggleOptions()">
                <option value="single" th:selected="${question.type=='single'}">单选题</option>
                <option value="judge" th:selected="${question.type=='judge'}">判断题</option>
                <option value="fill" th:selected="${question.type=='fill'}">填空题</option>
                <option value="essay" th:selected="${question.type=='essay'}">主观题</option>
            </select>
        </div>
        <div class="form-group"><label><i class="fas fa-book"></i> 科目</label><input name="subject" th:value="${question.subject}" placeholder="如：Java"></div>
        <div class="form-group"><label><i class="fas fa-question-circle"></i> 题干</label><textarea name="title" rows="4" required th:text="${question.title}"></textarea></div>
        <div id="options">
            <div class="grid">
                <input name="optionA" placeholder="A选项" th:value="${question.optionA}">
                <input name="optionB" placeholder="B选项" th:value="${question.optionB}">
                <input name="optionC" placeholder="C选项" th:value="${question.optionC}">
                <input name="optionD" placeholder="D选项" th:value="${question.optionD}">
            </div>
        </div>
        <div id="judgeHint" class="alert">判断题答案填写 A 表示正确，B 表示错误。</div>
        <div class="form-group"><label><i class="fas fa-check-circle"></i> 正确答案/参考答案</label><input name="answer" th:value="${question.answer}" required></div>
        <div class="form-group"><label><i class="fas fa-comment-dots"></i> 答案解析</label><textarea name="analysis" rows="3" th:text="${question.analysis}"></textarea></div>
        <div class="form-group"><label><i class="fas fa-image"></i> 题目图片</label><input type="file" name="imageFile"><div th:if="${question.imageUrl}"><img th:src="@{${question.imageUrl}}" style="max-height:120px; border-radius: 12px;"></div></div>
        <button class="btn-primary" type="submit"><i class="fas fa-save"></i> 保存</button>
    </form>
</div>
</body>
</html>
