<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>查看题目</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-eye"></i> 查看题目</h1>
        <a class="btn" th:href="@{/teacher/questions(page=${page})}"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>
    <div th:if="${question==null}" class="alert">题目不存在</div>
    <div th:if="${question!=null}" class="card">
        <p><b><i class="fas fa-tag"></i> 题型：</b><span th:text="${question.type}"></span></p>
        <p><b><i class="fas fa-book"></i> 科目：</b><span th:text="${question.subject}"></span></p>
        <p><b><i class="fas fa-layer-group"></i> 知识点：</b>
            <span th:text="${question.knowledgePoint}"></span>
            <span th:if="${question.knowledgePointId != null}" class="badge">（已关联）</span>
        </p>
        <p><b><i class="fas fa-signal"></i> 难度：</b><span th:text="${question.difficulty}"></span></p>
        <p><b><i class="fas fa-question"></i> 题干：</b><span th:text="${question.title}"></span></p>
        <p th:if="${question.optionA}">A. <span th:text="${question.optionA}"></span></p>
        <p th:if="${question.optionB}">B. <span th:text="${question.optionB}"></span></p>
        <p th:if="${question.optionC}">C. <span th:text="${question.optionC}"></span></p>
        <p th:if="${question.optionD}">D. <span th:text="${question.optionD}"></span></p>
        <p th:if="${question.optionE}">E. <span th:text="${question.optionE}"></span></p>
        <p><b><i class="fas fa-check"></i> 答案：</b><span th:text="${question.answer}"></span></p>
        <p><b><i class="fas fa-balance-scale"></i> 评分规则：</b><span th:text="${question.scoringRule}"></span></p>
        <p><b><i class="fas fa-lightbulb"></i> 解析：</b><span th:text="${question.analysis}"></span></p>
        <div th:if="${question.codeSnippet}">
            <p><b><i class="fas fa-code"></i> 预置代码：</b></p>
            <pre th:text="${question.codeSnippet}" style="background:#f1f5f9;padding:10px;border-radius:8px;"></pre>
        </div>
        <div th:if="${question.testCases}">
            <p><b><i class="fas fa-vial"></i> 测试用例：</b></p>
            <pre th:text="${question.testCases}" style="background:#f1f5f9;padding:10px;border-radius:8px;"></pre>
        </div>
        <img th:if="${question.imageUrl}" th:src="@{${question.imageUrl}}" style="max-width:100%">
    </div>
</div>
</body>
</html>
