<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑用户</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1 th:text="${user.id == null ? '新增用户' : '修改用户'}"></h1>
        <a class="btn" href="/admin/users">返回</a>
    </div>
    <form method="post" th:action="@{/admin/users/save}">
        <input type="hidden" name="id" th:value="${user.id}">
        <div class="form-group"><label>用户名</label><input name="username" th:value="${user.username}" required></div>
        <div class="form-group"><label>密码</label><input name="password" type="password" placeholder="留空则不修改密码"></div>
        <div class="form-group"><label>姓名</label><input name="realName" th:value="${user.realName}"></div>
        <div class="form-group"><label>角色</label>
            <select name="role">
                <option value="student" th:selected="${user.role == 'student'}">学生</option>
                <option value="teacher" th:selected="${user.role == 'teacher'}">教师</option>
                <option value="admin" th:selected="${user.role == 'admin'}">管理员</option>
            </select>
        </div>
        <div class="form-group"><label>班级</label><input name="className" th:value="${user.className}"></div>
        <div class="form-group"><label>学号</label><input name="studentNo" th:value="${user.studentNo}"></div>
        <button class="btn-primary">保存</button>
    </form>
</div>
</body>
</html>
