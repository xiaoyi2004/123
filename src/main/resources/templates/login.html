<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录 - 在线考试系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <div class="header" style="border-bottom: none; text-align: center; justify-content: center;">
        <h1><i class="fas fa-graduation-cap"></i> 在线考试系统</h1>
    </div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form method="post" action="/login">
        <div class="form-group">
            <label><i class="fas fa-user"></i> 用户名</label>
            <input name="username" required autofocus>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> 密码</label>
            <input name="password" type="password" required>
        </div>
        <div style="display: flex; gap: 1rem; justify-content: space-between; align-items: center;">
            <button class="btn-primary" type="submit"><i class="fas fa-sign-in-alt"></i> 登录</button>
            <a class="btn" href="/register"><i class="fas fa-user-plus"></i> 注册</a>
        </div>
    </form>
</div>
</body>
</html>
