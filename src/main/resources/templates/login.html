<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-container">
<div class="container">
    <h1><i class="fas fa-graduation-cap"></i> 在线考试系统</h1>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form method="post" action="/login">
        <div class="form-group">
            <label><i class="fas fa-user"></i> 用户名</label>
            <input name="username" required>
        </div>
        <div class="form-group">
            <label><i class="fas fa-lock"></i> 密码</label>
            <input name="password" type="password" required>
        </div>
        <div style="display:flex; gap:12px; margin-top:8px;">
            <button class="btn-primary" style="flex:1;"><i class="fas fa-sign-in-alt"></i> 登录</button>
            <a class="btn" href="/register"><i class="fas fa-user-plus"></i> 注册</a>
        </div>
    </form>
</div>
</body>
</html>
