<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生首页</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-user-graduate"></i> 学生端</h1>
        <div class="nav-links">
            <a class="btn" href="/student/results"><i class="fas fa-chart-bar"></i> 我的成绩</a>
            <a class="btn" href="/student/wrong-questions"><i class="fas fa-exclamation-triangle"></i> 错题解析</a>
            <a class="btn" href="/student/announcements"><i class="fas fa-bullhorn"></i> 公告</a>
            <a class="btn danger-btn" href="/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
        </div>
    </div>

    <div class="card">
        <p>
            <i class="fas fa-user"></i> <b>姓名：</b><span th:text="${student.realName}"></span>
            <i class="fas fa-users" style="margin-left:20px;"></i> <b>班级：</b><span th:text="${student.className}"></span>
            <i class="fas fa-id-card" style="margin-left:20px;"></i> <b>学号：</b><span th:text="${student.studentNo}"></span>
        </p>
    </div>

    <h2><i class="fas fa-clock"></i> 可参加考试</h2>
    <table>
        <thead>
        <tr>
            <th>考试</th>
            <th>科目</th>
            <th>班级</th>
            <th>时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${exams}">
            <td th:text="${e.name}"></td>
            <td th:text="${e.subject}"></td>
            <td th:text="${e.classNames}"></td>
            <td><span th:text="${e.startTime}"></span> 至 <span th:text="${e.endTime}"></span></td>
            <td><a class="btn-primary" th:href="@{/exam/{id}(id=${e.id})}"><i class="fas fa-pen"></i> 进入考试</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
