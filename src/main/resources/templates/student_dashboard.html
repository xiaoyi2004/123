<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>学生首页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-user-graduate"></i> 学生端</h1>
        <div class="nav-links">
            <a class="btn" href="/student/results"><i class="fas fa-chart-simple"></i> 我的成绩</a>
            <a class="btn danger-btn" href="/logout"><i class="fas fa-sign-out-alt"></i> 退出</a>
        </div>
    </div>
    <div class="card">
        <i class="fas fa-id-card"></i> <b>姓名：</b> <span th:text="${student.realName}"></span>　
        <i class="fas fa-school"></i> <b>班级：</b> <span th:text="${student.className}"></span>　
        <i class="fas fa-hashtag"></i> <b>学号：</b> <span th:text="${student.studentNo}"></span>
    </div>
    <h2><i class="fas fa-hourglass-half"></i> 可参加考试</h2>
    <table>
        <thead>
        <tr>
            <th>考试</th><th>科目</th><th>班级</th><th>时间</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e:${exams}">
            <td data-label="考试" th:text="${e.name}"></td>
            <td data-label="科目" th:text="${e.subject}"></td>
            <td data-label="班级" th:text="${e.classNames}"></td>
            <td data-label="时间"><span th:text="${e.startTime}"></span> 至 <span th:text="${e.endTime}"></span></td>
            <td data-label="操作"><a class="btn-primary" th:href="@{/exam/{id}(id=${e.id})}"><i class="fas fa-play"></i> 进入考试</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
