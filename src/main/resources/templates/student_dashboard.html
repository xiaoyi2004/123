<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的学习</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-graduation-cap"></i> 学生中心</h1>
        <div class="nav-links">
            <a href="/student/results" class="btn"><i class="fas fa-chart-line"></i> 我的成绩</a>
            <a href="/logout" class="btn danger-btn"><i class="fas fa-sign-out-alt"></i> 退出</a>
        </div>
    </div>

    <div class="card" style="margin-bottom: 2rem; background: linear-gradient(105deg, #ffffff 0%, #f8fafc 100%);">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <div>
                <h2>欢迎回来，<span th:text="${student.realName}"></span></h2>
                <p style="color: #475569;"><i class="fas fa-users"></i> <span th:text="${student.className}"></span> · 学号 <span th:text="${student.studentNo}"></span></p>
            </div>
            <div class="progress-bar" style="width: 200px;">
                <div class="progress-fill" style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <h2><i class="fas fa-clock"></i> 可参加的考试</h2>
    <div th:each="exam : ${exams}" class="exam-card">
        <div class="exam-title" th:text="${exam.name}"></div>
        <div class="exam-meta">
            <span><i class="fas fa-book"></i> <span th:text="${exam.subject}"></span></span>
            <span><i class="fas fa-users"></i> <span th:text="${exam.classNames}"></span></span>
            <span><i class="fas fa-hourglass-start"></i> <span th:text="${#temporals.format(exam.startTime, 'MM-dd HH:mm')}"></span></span>
            <span><i class="fas fa-hourglass-end"></i> <span th:text="${#temporals.format(exam.endTime, 'MM-dd HH:mm')}"></span></span>
        </div>
        <a th:href="@{/exam/{id}(id=${exam.id})}" class="btn-primary" style="margin-top: 1rem; display: inline-block;"><i class="fas fa-pen"></i> 开始考试</a>
    </div>
    <div th:if="${exams.empty}" class="alert">暂无进行中的考试，请耐心等待教师发布。</div>
</div>
</body>
</html>
