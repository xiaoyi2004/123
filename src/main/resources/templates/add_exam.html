<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布考试</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📅 发布新考试</h1>
        <a href="/teacher/dashboard" class="btn">← 返回仪表盘</a>
    </div>
    <form method="post" action="/teacher/exams/add">
        <div class="form-group">
            <label>考试名称</label>
            <input name="name" required>
        </div>
        <div class="form-group">
            <label>选择试卷</label>
            <select name="paperId">
                <option th:each="p : ${papers}" th:value="${p.id}" th:text="${p.name}"></option>
            </select>
        </div>
        <div class="form-group">
            <label>时长（分钟）</label>
            <input type="number" name="duration" value="60" min="1">
        </div>
        <div class="form-group">
            <label>开始时间</label>
            <input type="datetime-local" name="startTime" required>
        </div>
        <div class="form-group">
            <label>结束时间</label>
            <input type="datetime-local" name="endTime" required>
        </div>
        <button type="submit" class="btn-primary">发布考试</button>
    </form>
</div>
</body>
</html>
