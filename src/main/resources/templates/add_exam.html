<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布考试</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-calendar-alt"></i> 发布考试</h1>
        <a class="btn" href="/teacher/dashboard"><i class="fas fa-home"></i> 返回</a>
    </div>
    <div class="card">
        <form method="post" action="/teacher/exams/add">
            <div class="form-group"><label>考试名称</label><input name="name" required></div>
            <div class="form-group"><label>选择试卷</label>
                <select name="paperId" required>
                    <option value="">-- 请选择 --</option>
                    <option th:each="p : ${papers}" th:value="${p.id}" th:text="${p.name} + ' (' + p.subject + ')'"></option>
                </select>
            </div>
            <div class="form-group"><label>考试班级 (可多选)</label>
                <select name="classNamesList" multiple size="4">
                    <option th:each="c : ${classes}" th:value="${c}" th:text="${c}"></option>
                </select>
                <small class="muted">按住 Ctrl 键多选，留空则面向所有班级</small>
            </div>
            <div class="form-group"><label>开始时间</label><input type="datetime-local" name="startTime" required></div>
            <div class="form-group"><label>结束时间</label><input type="datetime-local" name="endTime" required></div>
            <div class="form-group"><label>考试时长 (分钟)</label><input type="number" name="duration" value="60" required></div>
            <button class="btn-primary" type="submit"><i class="fas fa-play-circle"></i> 发布考试</button>
        </form>
    </div>
</div>
</body>
</html>
