<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的成绩</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📊 成绩总览</h1>
        <div class="nav-links">
            <a href="/teacher/dashboard" class="btn">← 返回仪表盘</a>
            <a href="/logout" class="btn danger-btn">退出</a>
        </div>
    </div>

    <div th:if="${results.empty}" class="alert">暂无成绩记录。</div>
    <div class="table-responsive">
        <table>
            <thead>
            <tr><th>考试ID</th><th>学生ID</th><th>得分</th><th>提交时间</th><th>详情</th></tr>
            </thead>
            <tbody>
            <tr th:each="r : ${results}">
                <td th:text="${r.examId}"></td>
                <td th:text="${r.studentId}"></td>
                <td><strong th:text="${r.score}"></strong> 分</td>
                <td th:text="${#temporals.format(r.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td><a th:href="@{/result/detail/{id}(id=${r.id})}" class="btn-outline" style="padding: 4px 12px;">查看答卷</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
