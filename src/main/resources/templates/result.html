<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩列表</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-chart-line"></i> 成绩列表</h1>
        <div class="nav-links">
            <a class="btn" th:href="${session.user.role == 'teacher' ? '/teacher/dashboard' : '/student/dashboard'}">
                <i class="fas fa-arrow-left"></i> 返回
            </a>
            <!-- 教师导出按钮（仅当选择了具体考试时可用） -->
            <a th:if="${session.user.role == 'teacher' && selectedExamId != null}" class="btn-primary"
               th:href="@{/teacher/results/export/{examId}(examId=${selectedExamId})}">
                <i class="fas fa-file-excel"></i> 导出当前考试
            </a>
        </div>
    </div>

    <!-- 教师筛选表单 -->
    <form th:if="${session.user.role == 'teacher'}" method="get" action="/teacher/results" class="grid">
        <select name="examId">
            <option value="">全部考试</option>
            <option th:each="e : ${exams}" th:value="${e.id}" th:selected="${selectedExamId == e.id}" th:text="${e.name}"></option>
            <option th:if="${#lists.isEmpty(exams)}" value="" disabled>暂无考试</option>
        </select>
        <select name="className">
            <option value="">全部班级</option>
            <option th:each="c : ${classes}" th:value="${c}" th:selected="${selectedClass == c}" th:text="${c}"></option>
            <option th:if="${#lists.isEmpty(classes)}" value="" disabled>暂无班级</option>
        </select>
        <button class="btn-primary"><i class="fas fa-filter"></i> 筛选</button>
    </form>

    <!-- 成绩表格 -->
    <table>
        <thead>
        <tr>
            <th>学生</th>
            <th>班级</th>
            <th>考试</th>
            <th>客观分</th>
            <th>主观分</th>
            <th>总分</th>
            <th>状态</th>
            <th>提交时间</th>
            <th>详情</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${results}">
            <td th:text="${studentMap != null ? studentMap.get(r.studentId)?.realName : student?.realName}"></td>
            <td th:text="${studentMap != null ? studentMap.get(r.studentId)?.className : student?.className}"></td>
            <td th:text="${examMap != null ? examMap.get(r.examId)?.name : r.examId}"></td>
            <td th:text="${r.objectiveScore}"></td>
            <td th:text="${r.subjectiveScore}"></td>
            <td th:text="${r.score}"></td>
            <td>
                <span th:if="${r.gradeStatus == '已批阅'}" style="color:green;">已批阅</span>
                <span th:if="${r.gradeStatus == '待批阅'}" style="color:orange;">待批阅</span>
            </td>
            <td th:text="${r.submitTime}"></td>
            <td>
                <a class="btn-outline" th:href="@{/result/detail/{id}(id=${r.id})}">
                    <i class="fas fa-eye"></i> 查看完整题目
                </a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(results)}">
            <td colspan="9" style="text-align:center; padding:20px; color:#999;">暂无成绩记录</td>
        </tr>
        </tbody>
    </table>

    <!-- 统计信息（教师端，有成绩时显示） -->
    <div th:if="${session.user.role == 'teacher' && statistics != null && !#lists.isEmpty(results)}" class="card" style="margin-top:20px;">
        <p>
            <i class="fas fa-calculator"></i> <b>平均分：</b><span th:text="${statistics?.average}"></span>　
            <b>最高分：</b><span th:text="${statistics?.max}"></span>　
            <b>最低分：</b><span th:text="${statistics?.min}"></span>　
            <b>及格率：</b><span th:text="${statistics?.passRate != null ? #numbers.formatDecimal(statistics.passRate * 100, 0, 1) + '%' : ''}"></span>
        </p>
        <div th:if="${statistics?.segments}">
            <b>分数段：</b>
            <span th:each="entry : ${statistics.segments}">
                <span th:text="${entry.key} + ':' + ${entry.value} + '人'"></span>
                <span th:if="${!entryStat.last}"> | </span>
            </span>
        </div>
    </div>
</div>
</body>
</html>
