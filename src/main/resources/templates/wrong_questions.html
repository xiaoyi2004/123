<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>错题解析</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-exclamation-triangle"></i> 错题解析</h1>
        <a class="btn" href="/student/dashboard"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>
    <div th:if="${#lists.isEmpty(wrongList)}" class="alert alert-success">暂无错题，继续加油！</div>
    <div th:each="item : ${wrongList}" class="question-card">
        <h3><span th:text="${item.question.title}"></span></h3>
        <p th:if="${item.question.optionA}">A. <span th:text="${item.question.optionA}"></span></p>
        <p th:if="${item.question.optionB}">B. <span th:text="${item.question.optionB}"></span></p>
        <p th:if="${item.question.optionC}">C. <span th:text="${item.question.optionC}"></span></p>
        <p th:if="${item.question.optionD}">D. <span th:text="${item.question.optionD}"></span></p>
        <p><b>你的答案：</b><span th:text="${item.studentAnswer}"></span></p>
        <p><b>正确答案：</b><span th:text="${item.correctAnswer}"></span></p>
        <p><b>解析：</b><span th:text="${item.analysis}"></span></p>
        <p><span class="badge" th:text="'考试：' + ${item.examName}"></span></p>
    </div>
</div>
</body>
</html>
