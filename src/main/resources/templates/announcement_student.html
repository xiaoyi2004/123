<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>公告通知</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
  <div class="header">
    <h1><i class="fas fa-bullhorn"></i> 公告通知</h1>
    <a class="btn" th:href="${session.user.role == 'student' ? '/student/dashboard' : '/teacher/dashboard'}"><i class="fas fa-arrow-left"></i> 返回</a>
  </div>
  <div th:if="${#lists.isEmpty(announcements)}" class="alert">暂无公告</div>
  <div th:each="a : ${announcements}" class="card">
    <h3 th:text="${a.title}"></h3>
    <p th:text="${a.content}"></p>
    <p class="muted">发布人ID：<span th:text="${a.publisherId}"></span> 发布时间：<span th:text="${a.createdAt}"></span></p>
  </div>
</div>
</body>
</html>
