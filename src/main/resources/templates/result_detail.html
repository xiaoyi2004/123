<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩详情</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-file-alt"></i> <span th:text="${exam.name}"></span> - 成绩详情</h1>
        <a class="btn" th:href="${session.user.role=='teacher'?'/teacher/results':'/student/results'}"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>
    <div class="card">
        <i class="fas fa-user"></i> <b>学生：</b> <span th:text="${student?.realName}"></span>　
        <i class="fas fa-school"></i> <b>班级：</b> <span th:text="${student?.className}"></span>　
        <i class="fas fa-hashtag"></i> <b>学号：</b> <span th:text="${student?.studentNo}"></span>　
        <i class="fas fa-star"></i> <b>总分：</b> <span th:text="${result.score}"></span>　
        <i class="fas fa-check-circle"></i> <b>状态：</b> <span th:text="${result.gradeStatus}"></span>
    </div>
    <div th:each="d,stat:${details}" class="question-card">
        <h3><span th:text="${stat.index+1} + '. ' + ${d.question.title}"></span><span class="badge" th:text="${d.score} + '/' + ${d.fullScore} + '分'"></span></h3>
        <p th:if="${d.question.optionA}"><i class="fas fa-circle"></i> A. <span th:text="${d.question.optionA}"></span></p>
        <p th:if="${d.question.optionB}"><i class="fas fa-circle"></i> B. <span th:text="${d.question.optionB}"></span></p>
        <p th:if="${d.question.optionC}"><i class="fas fa-circle"></i> C. <span th:text="${d.question.optionC}"></span></p>
        <p th:if="${d.question.optionD}"><i class="fas fa-circle"></i> D. <span th:text="${d.question.optionD}"></span></p>
        <img th:if="${d.question.imageUrl}" th:src="@{${d.question.imageUrl}}" style="max-width:100%; max-height:180px; border-radius: 12px;">
        <p><i class="fas fa-pencil-alt"></i> <b>我的回答：</b> <span th:text="${d.studentAnswer}"></span></p>
        <p><i class="fas fa-check-double"></i> <b>正确/参考答案：</b> <span th:text="${d.correctAnswer}"></span></p>
        <p><i class="fas fa-comment-dots"></i> <b>解析：</b> <span th:text="${d.question.analysis ?: '暂无解析'}"></span></p>
    </div>
</div>
</body>
</html>
