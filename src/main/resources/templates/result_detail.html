<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成绩详情</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-file-alt"></i> 答卷详情 · <span th:text="${exam.name}"></span></h1>
        <a th:href="${session.user.role == 'teacher'} ? '/teacher/results' : '/student/results'" class="btn"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>
    <div class="card" style="margin-bottom: 1.5rem;">
        <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
            <span><i class="fas fa-user"></i> <span th:text="${student.realName}"></span> (<span th:text="${student.className}"></span>)</span>
            <span><i class="fas fa-star"></i> 总分：<strong th:text="${result.score}"></strong></span>
            <span><i class="fas fa-check-circle"></i> 状态：<span th:text="${result.gradeStatus}"></span></span>
        </div>
    </div>

    <div th:each="d,stat : ${details}" class="question-card" style="margin-bottom: 1.25rem;">
        <div style="display: flex; justify-content: space-between;">
            <h3><span th:text="${stat.index+1} + '. ' + ${d.question.title}"></span></h3>
            <span class="badge" th:text="${d.score} + '/' + ${d.fullScore} + '分'"></span>
        </div>
        <div th:if="${d.question.optionA}">A. <span th:text="${d.question.optionA}"></span></div>
        <div th:if="${d.question.optionB}">B. <span th:text="${d.question.optionB}"></span></div>
        <div th:if="${d.question.optionC}">C. <span th:text="${d.question.optionC}"></span></div>
        <div th:if="${d.question.optionD}">D. <span th:text="${d.question.optionD}"></span></div>
        <div style="margin-top: 0.75rem; background:#f8fafc; padding:0.75rem; border-radius:1rem;">
            <p><i class="fas fa-user-edit"></i> <strong>你的答案：</strong> <span th:text="${d.studentAnswer} ?: '(未作答)'"></span></p>
            <p><i class="fas fa-check"></i> <strong>参考答案：</strong> <span th:text="${d.correctAnswer}"></span></p>
            <p><i class="fas fa-lightbulb"></i> <strong>解析：</strong> <span th:text="${d.question.analysis ?: '暂无解析'}"></span></p>
        </div>
    </div>
</div>
</body>
</html>
