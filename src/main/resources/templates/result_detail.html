<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>成绩详情</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-file-alt"></i> 成绩详情：<span th:text="${exam.name}"></span></h1>
        <a class="btn" th:href="${session.user.role == 'teacher' ? '/teacher/results' : '/student/results'}">
            <i class="fas fa-arrow-left"></i> 返回
        </a>
    </div>

    <div class="card">
        <p>
            <i class="fas fa-user"></i> <b>学生：</b><span th:text="${student?.realName}"></span>
            <i class="fas fa-users" style="margin-left:20px;"></i> <b>班级：</b><span th:text="${student?.className}"></span>
            <i class="fas fa-id-card" style="margin-left:20px;"></i> <b>学号：</b><span th:text="${student?.studentNo}"></span>
            <i class="fas fa-star" style="margin-left:20px;"></i> <b>总分：</b><span th:text="${result.score}"></span>
            <i class="fas fa-check-circle" style="margin-left:20px;"></i> <b>状态：</b><span th:text="${result.gradeStatus}"></span>
        </p>
    </div>

    <div th:each="d,stat : ${details}" class="question-card">
        <h3>
            <span th:text="${stat.index+1} + '. ' + ${d.question.title}"></span>
            <span class="badge" th:text="${d.score} + '/' + ${d.fullScore} + '分'"></span>
            <span th:if="${d.isCorrect}" class="badge" style="background:#d1fae5;color:#065f46;"><i class="fas fa-check"></i> 正确</span>
            <span th:if="${!d.isCorrect}" class="badge" style="background:#fee2e2;color:#991b1b;"><i class="fas fa-times"></i> 答错</span>
        </h3>

        <!-- 选项 -->
        <p th:if="${d.question.optionA}">A. <span th:text="${d.question.optionA}"></span></p>
        <p th:if="${d.question.optionB}">B. <span th:text="${d.question.optionB}"></span></p>
        <p th:if="${d.question.optionC}">C. <span th:text="${d.question.optionC}"></span></p>
        <p th:if="${d.question.optionD}">D. <span th:text="${d.question.optionD}"></span></p>
        <p th:if="${d.question.optionE}">E. <span th:text="${d.question.optionE}"></span></p>

        <!-- 图片 -->
        <img th:if="${d.question.imageUrl}" th:src="@{${d.question.imageUrl}}" style="max-width:100%;max-height:180px">

        <p><b><i class="fas fa-pencil-alt"></i> 我的回答：</b><span th:text="${d.studentAnswer}"></span></p>
        <p><b><i class="fas fa-check"></i> 正确答案：</b><span th:text="${d.correctAnswer}"></span></p>
        <!-- 仅当教师允许查看解析时显示 -->
        <p th:if="${exam.showAnalysis == 1}">
            <b><i class="fas fa-lightbulb"></i> 解析：</b><span th:text="${d.question.analysis ?: '暂无解析'}"></span>
        </p>
        <p th:if="${exam.showAnalysis != 1}" class="muted">解析已关闭</p>
    </div>
</div>
</body>
</html>
