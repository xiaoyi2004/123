<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>主观题批阅</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-pen-nib"></i> 待批阅试卷</h1>
        <a class="btn" href="/teacher/dashboard"><i class="fas fa-tachometer-alt"></i> 返回</a>
    </div>
    <table>
        <thead><tr><th>学生</th><th>班级</th><th>考试</th><th>客观分</th><th>提交时间</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="r:${results}">
            <td data-label="学生" th:text="${studentMap.get(r.studentId)?.realName}"></td>
            <td data-label="班级" th:text="${studentMap.get(r.studentId)?.className}"></td>
            <td data-label="考试" th:text="${examMap.get(r.examId)?.name}"></td>
            <td data-label="客观分" th:text="${r.objectiveScore}"></td>
            <td data-label="提交时间" th:text="${r.submitTime}"></td>
            <td data-label="操作"><a class="btn-primary" th:href="@{/teacher/grading/{id}(id=${r.id})}"><i class="fas fa-check-double"></i> 批阅</a></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
