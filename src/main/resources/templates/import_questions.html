<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>批量导入题目</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-upload"></i> 批量导入题目</h1>
        <a class="btn" href="/teacher/questions"><i class="fas fa-arrow-left"></i> 返回题库</a>
    </div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <div class="card">
        <form method="post" action="/teacher/questions/import" enctype="multipart/form-data">
            <div class="form-group">
                <label><i class="fas fa-file-alt"></i> 选择 .txt 或 .docx 文件</label>
                <input type="file" name="file" accept=".txt,.docx" required>
            </div>
            <button class="btn-primary" type="submit"><i class="fas fa-upload"></i> 开始导入</button>
        </form>
        <div style="margin-top: 1rem; padding: 1rem; background:#f1f5f9; border-radius: 1rem;">
            <p><i class="fas fa-info-circle"></i> 格式说明：每道题之间空一行，支持题型自动识别。示例：</p>
            <pre style="background:white; padding:0.5rem; border-radius:0.5rem;">
1. 题干内容
A. 选项A
B. 选项B
C. 选项C
D. 选项D
答案：A
解析：这里是解析。
            </pre>
        </div>
    </div>
</div>
</body>
</html>
