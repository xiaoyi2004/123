<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>批量导入题目</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1><i class="fas fa-upload"></i> 批量导入题目</h1>
        <a class="btn" href="/teacher/questions"><i class="fas fa-arrow-left"></i> 返回</a>
    </div>
    <div th:if="${error}" class="alert" th:text="${error}"></div>
    <form method="post" action="/teacher/questions/import" enctype="multipart/form-data">
        <div class="form-group"><label><i class="fas fa-file-word"></i> 选择 .txt 或 .docx 文件</label><input type="file" name="file" required></div>
        <button class="btn-primary" type="submit"><i class="fas fa-cloud-upload-alt"></i> 导入</button>
    </form>
    <div class="card"><i class="fas fa-info-circle"></i> 格式示例：题干、A./B./C./D. 选项、答案：A、解析：说明。</div>
</div>
</body>
</html>
